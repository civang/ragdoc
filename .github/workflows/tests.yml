name: tests

# Run unit tests and the retrieval eval suite on every push and pull request.
# Both measure behaviour that needs no API key, so CI costs nothing to run -
# which is exactly why they make a good gate.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-potion-base-8M

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run retrieval evals
        # Exits non-zero if Hit@1 drops below the 80% gate in evals.py,
        # which fails the build.
        run: python evals.py
